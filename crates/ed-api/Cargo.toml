[package]
name = "ed-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fastcdc = "3"
flate2 = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
memmap2 = "0.9"
anyhow = "1"
axum = "0.8"
ed-eddn = { path = "../ed-eddn", features = ["live"] }
ed-domain = { path = "../ed-domain" }
ed-galaxy = { path = "../ed-galaxy" }
ed-route = { path = "../ed-route" }
ed-store = { path = "../ed-store", features = ["postgres"] }
ed-sync = { path = "../ed-sync" }
ed-ebex = { path = "../ed-ebex" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

[target.'cfg(unix)'.dependencies]
# getrusage for publication CPU accounting; the server is Linux, the
# Windows dev build just records NULL.
libc = "0.2"

[dev-dependencies]
serde_urlencoded = "0.7"
flate2 = "1"
http-body-util = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
