[package]
name = "ed-journal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Parses Elite Dangerous journal files into live materials/cargo/status state, with correct internal-name resolution via a vendored EDCD/FDevIDs catalog."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
